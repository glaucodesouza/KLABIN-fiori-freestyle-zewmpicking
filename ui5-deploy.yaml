# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: br.com.klabin.zewmpicking2
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: S4D100
          url: http://s4d:44300
        app:
          name: zewmpicking2
          description: Picking
          package: zewm
          transport: S4DK925101
        exclude:
          - /test/
